# Commit-time checks for a Python project: lint, format, types, shell scripts, secrets
# Install: copy to .pre-commit-config.yaml at the repo root, then `pre-commit install`
repos:
  # Lint with auto-fix, then format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Type-check the whole project
  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.2
    hooks:
      - id: pyrefly-check

  # Lint shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Block committed secrets (API keys, tokens, private keys)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
